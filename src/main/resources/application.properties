spring.application.name=java10
server.port=${PORT:8080}
server.servlet.context-path=/api
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/messages}
spring.datasource.username=${DB_USERNAME:messages}
spring.datasource.password=${DB_PASSWORD:messages}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql
logging.level.org.springframework.jdbc.core=INFO

management.endpoints.web.exposure.include=health,info,prometheus
management.server.port=${MANAGEMENT_PORT:8081}
management.info.env.enabled=true
info.app.name=Messages API
spring.main.banner-mode=off
