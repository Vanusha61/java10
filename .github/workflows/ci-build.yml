name: Java CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java version
        run: java -version
      - name: Build and test
        id: build
        run: |
          chmod +x gradlew
          ./gradlew clean build --no-daemon
      - name: Test status
        if: always()
        run: echo 'Build and test status = ${{ steps.build.outcome }}'
      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/test/
          if-no-files-found: ignore
      - name: Publish application JAR
        uses: actions/upload-artifact@v4
        with:
          name: java10-application
          path: build/libs/java10-1.0.0.jar
          if-no-files-found: error
